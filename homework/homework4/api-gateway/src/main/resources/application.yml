spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: orders-service
          uri: ${ORDERS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders/(?<segment>.*), /api/orders/${segment}
        - id: payments-service
          uri: ${PAYMENTS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/payments/(?<segment>.*), /api/payments/${segment}

server:
  port: 8080

springdoc:
  swagger-ui:
    urls:
      - name: orders-service
        url: ${ORDERS_SERVICE_URL:http://localhost:8081}/v3/api-docs
      - name: payments-service
        url: ${PAYMENTS_SERVICE_URL:http://localhost:8082}/v3/api-docs
